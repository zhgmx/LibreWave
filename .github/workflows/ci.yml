name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            acl \
            clang \
            fontconfig \
            libasound2-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libusb-1.0-0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            pkg-config

      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(awk -F '"' '/^channel/ { print $2; exit }' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ubuntu-24.04
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test headless workspace
        run: cargo test --workspace --exclude librewave

      - name: Test workspace with all features
        run: cargo test --workspace --all-features

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build headless applications
        run: cargo build --package librewaved --package librewavectl

      - name: Build GPUI application
        run: cargo build --package librewave
