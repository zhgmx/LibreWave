[workspace]
members = [
    "crates/librewave-device",
    "crates/librewave-core",
    "crates/librewave-ipc",
    "crates/librewave-protocol",
    "crates/librewave-platform-linux",
    "crates/librewaved",
    "crates/librewavectl",
    "crates/librewave-ui",
    "crates/librewave",
]
default-members = [
    "crates/librewave-device",
    "crates/librewave-core",
    "crates/librewave-ipc",
    "crates/librewave-protocol",
    "crates/librewave-platform-linux",
    "crates/librewaved",
    "crates/librewavectl",
    "crates/librewave-ui",
]
resolver = "3"

[workspace.dependencies]
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.0"
authors = ["Max Zhang"]
license = "MIT"
repository = "https://github.com/zhgmx/LibreWave"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
