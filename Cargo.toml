[workspace]
members = ["crates/librewave-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.0"
authors = ["Max Zhang"]
license = "MIT"
repository = "https://github.com/zhgmx/LibreWave"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
