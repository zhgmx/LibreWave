[package]
name = "librewave-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional GPUI presentation shell for LibreWave"

[features]
default = []
gpui = ["dep:gpui", "dep:gpui-platform", "dep:librewave-core", "dep:librewave-ipc", "dep:librewave-platform-linux", "dep:librewavectl", "dep:image", "dep:resvg", "dep:unicode-segmentation"]
gpui-tests = ["gpui", "gpui/test-support"]

[dependencies]
unicode-segmentation = { version = "1.13.3", optional = true }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "8dd255c3eafb5231056fe4e6f601cedd011f1c93", package = "gpui", version = "0.2", optional = true }
gpui-platform = { git = "https://github.com/zed-industries/zed.git", rev = "8dd255c3eafb5231056fe4e6f601cedd011f1c93", package = "gpui_platform", optional = true, features = ["wayland", "x11"] }
librewave-core = { path = "../librewave-core", optional = true }
librewave-ipc = { path = "../librewave-ipc", optional = true }
librewave-platform-linux = { path = "../librewave-platform-linux", optional = true }
librewavectl = { path = "../librewavectl", optional = true }
image = { version = "0.25", default-features = false, optional = true }

[build-dependencies]
resvg = { version = "0.45", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
