[package]
name = "librewave-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional GPUI presentation shell for LibreWave"

[features]
default = []
gpui = ["dep:gpui", "dep:gpui-platform", "dep:librewave-core", "dep:librewave-ipc", "dep:librewave-platform-linux", "dep:librewavectl"]
gpui-tests = ["gpui", "gpui/test-support"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "236e6ddf54e0763d0343f4d3e369d2ae00fe9670", package = "gpui", optional = true }
gpui-platform = { git = "https://github.com/zed-industries/zed.git", rev = "236e6ddf54e0763d0343f4d3e369d2ae00fe9670", package = "gpui_platform", optional = true, features = ["wayland", "x11"] }
librewave-core = { path = "../librewave-core", optional = true }
librewave-ipc = { path = "../librewave-ipc", optional = true }
librewave-platform-linux = { path = "../librewave-platform-linux", optional = true }
librewavectl = { path = "../librewavectl", optional = true }

[lints]
workspace = true
